name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      # 检索层评测是确定性的、不调用模型，所以可以放进 CI 做回归门槛。
      # 编排层与面试闭环要真调 API，只在本地按需跑（scripts/eval_all.py）。
      - name: Retrieval eval (offline, no API calls)
        run: python scripts/eval_all.py --offline

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: web
        run: npm install
      - name: TypeScript check + Vite build
        working-directory: web
        run: npm run build
